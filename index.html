# Карта рынка — Россия / Европа / США

Краткий обзор того, кто учит детей ИИ-грамотности и программированию по трём географиям — с какой ценой, в каком формате и для какого возраста. Источники — три research-summary в `raw/market/`. Это синтез, не каталог: только те конкуренты, которые формируют ландшафт нашей позиции.

---

## Россия

### Коммерческие школы

Российский коммерческий рынок детских школ программирования крупный и зрелый, но **сосредоточен в полосе 12–17 лет** с ценовым уровнем ₽1,000–2,500 за занятие. Основная программа — Scratch → Python → Roblox / Minecraft / web. ИИ-литературность как отдельный продукт пока не выделена.

| Школа | Возраст | Цена | Формат | Что у них | Где мы расходимся |
|---|---|---|---|---|---|
| **[Алгоритмика](https://algoritmika.org)** | 6–17 | ~₽600–1,500 / занятие | Массовый франчайзинг (онлайн + офлайн) | Scratch → Python → Roblox; широкая сеть, узнаваемый бренд | Мы строим продукт *для* 9–12 как самостоятельный, не ступеньку. Когорта 4 ребёнка + ментор 1:1 |
| **[Кодабра](https://codabra.org)** | 7–17 | ~₽1,500 / занятие | Онлайн + офлайн | Игровые форматы, Roblox/Minecraft фокус | Без AI-Maker трека и без strengths-discovery |
| **[Kodland](https://kodland.org)** | 8–17 | ~₽1,500 / занятие; курс ₽47,600 за 32 занятия | Онлайн групповой | Scratch → Python; крепкое исполнение | Мы — премиум-сегмент с индивидуальным ментором, они — массовая когорта |
| **[Skysmart Pro](https://skysmart.ru)** | 8–18 | ₽1,170–2,343 / занятие | Онлайн групповой | Часть EdTech-холдинга, широкая программа | Без вайб-кодинга и без AI-литературности как отдельных треков |
| **[CODDY](https://coddyschool.com)** | 4–17 | премиум-сегмент | Онлайн + офлайн | 80+ направлений, премиальное позиционирование | Нет фокуса на 9–12 + AI-Maker |
| **[Foxford](https://foxford.ru)** | 8–17 | подписка | Онлайн | Уклон в подготовку к ЕГЭ / олимпиадам | Не наш сегмент по задаче |

### Бесплатные государственные и корпоративные программы

Это главный конкурент по «глубине бесплатно». Для школьников в России доступна полноценная траектория от введения в нейросети в 5 классе до сборной на Международной олимпиаде по ИИ (Россия выиграла IOAI 2025 в общем зачёте: 6 золотых).

| Программа | Возраст | Что дают | Где мы расходимся |
|---|---|---|---|
| **[Код будущего](https://futurecode.ru)** (Минцифры + Университет 2035) | 8–11 классы | 144 акад. часа Python / ML; 60K школьников 2025/26; +10 баллов к ЕГЭ | Их аудитория — мотивированные подростки-олимпиадники, не 9–12-летние без задачи на ЕГЭ |
| **[Академия ИИ для школьников](https://ai-academy.ru)** (Сбер) | 5–11 классы | Полный ML-стек, хакатоны до ₽250,000 призовых | Глубоко, но олимпиадно-ориентировано |
| **[Сириус.Курсы](https://edu.sirius.online)** | 7–11 классы | 18 последовательных курсов, 100+ авторов из вузов | Та же история — для тех, кто уже выбрал ИИ как карьеру |
| **[Яндекс Лицей](https://lyceum.yandex.ru)** | 13–20 | Бесплатно, по конкурсу, 156 городов; Physical AI с 2025/26 | По возрасту мы стартуем раньше; по формату они — кружок, мы — премиум-курс с ментором |
| **[Урок цифры](https://урокцифры.рф)** | 1–11 классы | Короткие интерактивные тренажёры, 23.3M прохождений / сезон | Это пробник, не курс |
| **[Stepik](https://stepik.org)** | любой | MOOC, «ИИ-старт» от МФТИ + Сбера | Платформа, не сопровождение |

**Главный риск:** для родителей, которые могут провести ребёнка в Сириус или Лицей, бесплатное «глубже» нашего платного. Поэтому мы **не конкурируем с ними по глубине ИИ для подростков-олимпиадников** — мы конкурируем с ними по **формирующему опыту 9–12 лет**, который у бесплатных программ не закрыт. Их ниша — мотивированные подростки; наша — формирование идентичности тинейджера на пороге.

## Европа

В Европе ландшафт принципиально другой: **самые сильные программы — бесплатные**, профинансированы университетскими и государственными партнёрами. Премиальный частный сегмент существует, но не доминирует культурно.

| Программа | Возраст | Цена | Что дают | Где мы расходимся |
|---|---|---|---|---|
| **[Raspberry Pi Experience AI](https://experience-ai.org)** (UK + 25 стран, партнёр Google DeepMind) | 11–14 | Бесплатно | Курсы для классных занятий и онлайн; 2M+ учеников; премия UNESCO ICT 2025 | Школьная программа, не индивидуальное сопровождение; не на русском |
| **[Elements of AI / Building AI](https://elementsofai.com)** (U. Helsinki + MinnaLearn) | подростки + взрослые | Бесплатно | MOOC на 26 языках, 2M+ учеников, 170 стран | Не для младших, не on-demand-кохорта, не на русском |

**Что это значит для нас:** в Европе нет премиального русскоязычного игрока в нашей нише. Международные английские бутики (см. ниже) — основной альтернативный путь для русскоязычных семей в Европе, и они проигрывают в языке и культурном коде.

## США

Самый зрелый рынок премиум-бутиковых школ программирования и первая волна вайб-кодинга для детей. Здесь уже выделена отдельная категория «vibecoding for kids» с продуктами под Lovable / Bolt / Cursor / Replit Agent.

### Премиум-бутики

| Школа | Возраст | Цена | Формат | Что у них | Где мы расходимся |
|---|---|---|---|---|---|
| **[Juni Learning](https://junilearning.com)** | 7–18 | $275–450 / мес | 1:1 онлайн | Бренд, инструкторы из Stanford / Berkeley | Английский; нет вайб-кодинга и strengths-discovery как отдельных треков |
| **AI Native Student** | подростки | $955 / мес | Когорта + 1:1, AI-native curriculum | Самый близкий аналог по подходу | Старшие дети; английский; не для 9–12 |
| **[CodaKid Vibe Coding](https://codakid.com)** | 8–18 | $29 / мес self-paced или $249 / мес 1:1 | Онлайн | Lovable + Cursor, prompt-engineering, AI-этика модули | Self-paced либо дешёвый 1:1; нет когортного компонента и strengths |
| **[Outschool 1:1](https://outschool.com)** | 3–18 | $60–100 / час | Онлайн-маркетплейс | Огромный выбор, низкий порог входа | Маркетплейс ≠ курс с прогрессией |

### Vibecoding-кэмпы и новые форматы

| Программа | Возраст | Формат | Заметка |
|---|---|---|---|
| **[theCoderSchool «Vibe Code Adventure»](https://thecoderschool.com)** | 10+ | Летний кэмп, 5 городов США | Lovable / Bolt; последний день — питч приложения родителям |
| **[Replit Vibe Coding 101](https://replit.com)** (с Campus.edu) | 8 недель онлайн | Кохорта со Stanford / Northwestern | Изначально для взрослых, но мотивированные тинейджеры записываются |
| **NYU ITP Camp / Miami Dade «Game ON!»** | 14–17 | Летние кэмпы | Vibecoding-сессии добавлены в 2025 |

### Бесплатные флагманы и масс-программы

| Программа | Возраст | Что дают |
|---|---|---|
| **[Hour of AI](https://hourofcode.com)** (ребрендинг Hour of Code, декабрь 2025) | весь K–12 | 13.1M участников за декабрь 2025; рамочное мероприятие |
| **[Girls Who Code](https://girlswhocode.com)** | 8–18 | Vibecoding включён в curriculum 2025; летняя программа Pathways |
| **[Inspirit AI](https://inspiritai.com) / [Create & Learn](https://create-learn.us) / [Code Ninjas AI Academy](https://codeninjas.com)** | 4–18 | Серия чат-бот / OpenAI-проектов для разных возрастов |
| Курсы Stanford / Carnegie Mellon / MIT | подростки | Бесплатно, через университетские fellowship-программы |

**Что это значит для нас:** в США уже выделена категория «vibecoding for kids», но **на английском**. Платформы для младших (Lovable / Bolt) и педагогические подходы можно перенять; **языковая ниша не закрыта**.

---

## Где мы среди этого

> wai-school — премиум русскоязычная AI-Maker Studio для 9–12 лет, с маленькими когортами (1:7 + ментор 1:1), безопасным ИИ через учительские аккаунты и двумя предъявимыми артефактами на выходе (опубликованное приложение + Паспорт сильных сторон). Пересечений по аудитории + языку + возрасту + содержанию ни с одним из перечисленных конкурентов нет.

Три конкретных контраста:

1. **Vs российские коммерческие школы (Алгоритмика, Кодабра, Kodland, Skysmart Pro, CODDY, Foxford):** мы сильнее в *формирующем* эффекте на 9–12 (маленькая когорта + индивидуальный ментор + strengths-discovery); они сильнее в масштабе, узнаваемости и количестве направлений.
2. **Vs российские бесплатные программы (Код будущего, Сириус.Курсы, Яндекс Лицей, Сбер):** мы — для тех, кто **ещё не выбрал ИИ как профессию**, и кому важен формат с сопровождением. Они — для мотивированных подростков-олимпиадников.
3. **Vs международные бутики (Juni Learning, AI Native Student, CodaKid):** мы на русском, понимаем культурный код русскоязычной семьи, и фокусируемся на возрасте, который они трактуют как ступеньку к старшим программам.

Окно временного отрыва — **12–18 месяцев**, пока кто-то из российских коммерческих школ не перепишет программу под вайб-кодинг для 9–12. И если перепишет — не факт, что выдержит цену + индивидуальное сопровождение.
