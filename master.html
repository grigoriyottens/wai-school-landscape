# wai-school — что мы строим

**wai-school** — премиальная бутиковая онлайн-школа для русскоязычных семей. Учим детей **9–12 лет** **AI-мастерству** — мастер-навыку, который объединяет в себе умение *думать* с ИИ (понимать, как технология работает, и грамотно с ней общаться), *делать* через ИИ (создавать реальные приложения с AI-ассистентами Lovable / Cursor / Claude Code) и другие связанные с этим компетенции.

**На запуске — только AI-мастерство.** В течение 2026 года добавим два поддерживающих трека: **исследование сильных сторон** (strengths discovery, методика Gallup Clifton StrengthsExplorer) и **социально-эмоциональные навыки с осознанностью** (SEL). Они supporting к ядру, не co-equal.

**Y1 — два продукта параллельно:** (1) помесячный online cohort — recurring core, ₽45K/мес; (2) летние очные интенсивы в Москве и нескольких других городах с большой русскоязычной аудиторией (Лимассол, Тбилиси, Белград, Дубай). Cohort'ы online — формат не привязан к городу, аудитория собирается отовсюду.

---

## Для кого

**Дети 9–12 лет.** Когнитивный «sweet spot»: переход от конкретного к абстрактному мышлению (Piaget — formal operations), уже умеют формулировать промты, но ещё не подростки. Российские конкуренты (Алгоритмика, Кодабра, Kodland, Skysmart Pro) толпятся в полосе 12–17 («настоящий Python», подготовка к работе) и трактуют 9–12 как ступеньку для апсейла. Мы строим продукт *для* этого возраста как формирующего идентичность, а не как промежуточного.

**Русскоязычные родители**, которым важно качество и индивидуальный подход для своего ребёнка. Тревожащиеся за «экранное время» и качество, скептичные к массовым франшизам, готовые платить премиум за то, что чувствуется премиальным. Локация — secondary параметр: формат полностью онлайн, когорты собираются из любых хабов (Москва, города России, диаспора). Конкретные парент-архетипы — TBD (см. [`decisions.md`](decisions.md) → Открытые вопросы).

---

## Что ребёнок и родитель получают на выходе

Три предъявимых артефакта + ритуал, которые имеет смысл показывать родственникам и самому себе:

1. **Опубликованное приложение или игра** с публичной URL-ссылкой, которую ребёнок отправляет друзьям и бабушке. Сделано самостоятельно через вайб-кодинг с AI-ассистентами (Lovable / Replit / Cursor / Claude Code). Все проекты, **дошедшие до публикации**, попадают в постоянный архив (Hall of Fame) на сайте школы — это не «топ-N» (status-game), но и не «архив всех записавшихся» (валидизм); это все, кто реально завершил.
2. **«Паспорт сильных сторон и интересов»** — персональный отчёт о ребёнке на основе наблюдений ментора и проектной выборки интересов (что попробовали: игра, чат-бот, веб-сайт, маркетинговая кампания). Обновляется раз в квартал. На launch'е формируется через mentor 1:1; полный strengths-discovery track с Gallup Clifton StrengthsExplorer methodology — добавится в течение 2026 года, тогда Passport upgrade'ится до full methodology.
3. **Demo Day (квартал)** — публичный показ, где ребёнок демонстрирует свой проект родителям, ментору и сверстникам. Параллельно — родительский вебинар с внешним экспертом (формат и спикеры решаются отдельно). На Demo Day происходят recognition-ритуалы (конкретные форматы — TBD, см. [`decisions.md`](decisions.md) → Открытые вопросы).

---

## Что движет родителем и ребёнком (JTBD-карта)

Каждая фича продукта закрывает конкретную глубокую нужду одной из двух сторон. Карта зафиксирована как канон в [`decisions.md`](decisions.md) (включая триггеры покупки, anxieties и habits в refined entry); любая новая фича обязана сослаться на JTBD, который она закрывает, или не строиться.

**Родитель — глубокие нужды:**
- Дать ребёнку преимущество в мире, который наступает (не «выжить в страшном» — а опередить).
- Снизить тревогу о том, что ребёнок отстаёт (inner state); видеть это через **доказательство способности** — работающие проекты, milestones, ментор-фидбек (external proof). Не через per-cohort ranking.
- Чувствовать, что я — хороший родитель, инвестирующий в будущее. Включая outer/social signaling: «я тот родитель, чей ребёнок делает крутые AI-вещи» — реальный driver для status-conscious и anxious non-tech archetypes.
- *(Utility-baseline:)* надёжное время, когда ребёнок занят чем-то развивающим.

**Ребёнок (9–12) — четыре red-line ценности:**
- **Fun.** Без него продукт сломан.
- **Peer recognition.** Одноклассники, друзья, родственники одобряют то, что я делаю.
- **Ownership.** Я выбрал, что строить (autonomy в decisions); и когда я это построил, в мире что-то реально произошло (agency через consequential effect — public URL, peer reaction, mentor feedback).
- **Mastery.** Я становлюсь хорош в чём-то трудном — felt sense «я разобрался», «я могу больше, чем мог вчера». Не fun и не recognition; distinct мотиватор для tween-age по Pink Drive framework.

| Фича | Родительская нужда | Детская ценность |
|---|---|---|
| Опубликованное приложение + public URL | «Опережает стандарт» (доказательство) | Peer recognition + ownership (agency) + mastery (видимый результат труда) |
| Demo Day (квартал) + Hall of Fame | «Опережает стандарт», ROI, social signaling | Peer recognition (выступление, архив) |
| Strengths & Interests Passport (квартал) | «Хороший родитель» — артефакт инвестиции | Идентичность («кем могу стать») |
| Mentor 1:1 + малая группа 1:7 | Premium, ROI | Ownership (взрослый меня слушает), mastery (mentor feedback as progress signal), fun (без давления) |
| Parent Dashboard (weekly + monthly + quarterly) | Видимость ROI | — |
| Parent Webinar с внешним экспертом (квартал) | «Хороший родитель», комьюнити | — |
| AI-мастерство как ядро программы | «Преимущество в мире» | Fun (вайб-кодинг как практика), ownership, mastery (skill progression) |

**Связанный коммит (type-4):** программа сохраняет реальную оценку работ и форсированный отсев не справляющихся (по [типологии Гриши](../raw/team-notes/grisha-four-types-of-education.md), это часть type-4 обучения). Конкретные механизмы оценки и recognition-ритуалы — TBD.

## Как мы это делаем

- **Когорта 1:7 + ментор 1:1.** Два групповых занятия по 7 детей в месяц + одно индивидуальное с ментором + родительский дашборд. Это не масс-онлайн-школа.
- **Цена ~₽45,000/месяц на ученика (≈€450), помесячная оплата.** Единый тариф Y1 (тиры — после первой когорты). Премиум-сегмент: сравнимы с верхней границей Juni Learning ($275–450/мес 1:1) и существенно ниже AI Native Student ($955/мес). В 3–4 раза дороже массовых российских школ (Алгоритмика ~₽12,000/мес) — это другая лига продукта: маленькая когорта 1:7 + ментор 1:1 + AI-мастерство как ядро программы. **Отсев — только за non-delivery** (несколько milestones подряд без работы); низкое качество работы НЕ повод; refund при предоплате.
- **Амбициозный год 1.** Плановый ramp: 22 платящих ученика в первый месяц запуска → 67 во второй → 111 в третий → **156 учеников и MRR ~7M ₽ (≈€70K) к концу 4-го месяца.** Юнит-экономика: ROMI 400–600%, retention 60–75%/мес.

---

## Чем мы отличаемся

| Альтернатива | Что у них | Что у нас |
|---|---|---|
| Российские инкумбенты (Алгоритмика, Кодабра, Kodland, Skysmart Pro) | Scratch → Python → Roblox для 12–17. 9–12 — ступенька. | Программа вокруг AI-мастерства для 9–12 как самостоятельный продукт — не довесок поверх Scratch/Python. (Гипотеза о конкурентном окне 12–18 мес — см. [`competitors.md`](competitors.md).) |
| Международные бутики (Juni Learning, AI Native Student, Outschool 1:1) | Английский, не подходит для русскоязычных семей по языку и культурному коду. | Русский, под русскоязычные семьи в их культурных и тревожных кодах — где бы они ни жили. |
| Бесплатные госпрограммы РФ («Код будущего», Сириус.Курсы, Академия ИИ Сбера) | Глубокий контент для мотивированных подростков-олимпиадников. | Идентичность-формирующий продукт для 9–12 с ментором, портфолио и паспортом сильных сторон. |

---

## Уникальное обещание (UVP)

> Премиальная русскоязычная программа **AI-мастерства** для детей 9–12. Маленькие когорты (1:7), ментор 1:1. На выходе — собственное опубликованное приложение и паспорт сильных сторон, которые ребёнок и родитель могут показать. Базируемся в Москве, принимаем семьи откуда угодно.
